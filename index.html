    <script>
      (function () {
        try {
          var target = typeof window !== "undefined" ? window : globalThis;
          if (!target) return;
          var nativeFetch = target.fetch;
          var currentFetch = typeof nativeFetch === "function" ? nativeFetch.bind(target) : nativeFetch;
          var propDesc = {
            get: function () {
              return currentFetch;
            },
            set: function (val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(target, "fetch", propDesc);
          } catch (_) {}
          if (typeof Window !== "undefined" && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, "fetch", propDesc);
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
